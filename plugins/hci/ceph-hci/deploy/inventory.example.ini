# Copy to inventory.ini and set host IPs (or run govc-create-vms.sh).

[hci_mgmt]
hci-mgmt ansible_host=10.0.0.10 ansible_user=opc ansible_become=true

[hci_nodes]
hci-node1 ansible_host=10.0.0.11 ansible_user=opc ansible_become=true
hci-node2 ansible_host=10.0.0.12 ansible_user=opc ansible_become=true
hci-node3 ansible_host=10.0.0.13 ansible_user=opc ansible_become=true

[hci:children]
hci_mgmt
hci_nodes

[hci:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
# Restrict to your lab VLAN when known, e.g. 192.168.71.0/24
ceph_public_network=0.0.0.0/0
ceph_release=squid
cloudstack_mgmt_db_password=cloud
cloudstack_version=4.23
